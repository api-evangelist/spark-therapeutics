description: >-
  Spark Therapeutics is a Philadelphia-based gene therapy company founded in
  2013 with roots at Children's Hospital of Philadelphia (CHOP). Spark
  developed Luxturna (voretigene neparvovec-rzyl), the first FDA-approved gene
  therapy for a genetic disease in the United States, approved in December 2017
  for the treatment of inherited retinal disease caused by biallelic RPE65
  mutations. Roche acquired Spark Therapeutics in December 2019 for
  approximately $4.3 billion, and Spark has since been integrated into the
  Roche Group, operating as a Genentech subsidiary. The original sparktx.com
  domain now redirects to gene.com/spark. Spark does not publish any public
  developer APIs, OpenAPI specifications, SDKs, or GitHub organization. As a
  pharmaceutical/biotech operating under Roche, Spark's public technical
  surface is limited to patient and prescriber information for Luxturna and
  adverse event reporting channels (FDA MedWatch and 1-855-SPARKTX).
